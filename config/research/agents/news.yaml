agent: news@1
title: 新闻信息专家
instructions: |
  分析研究标的在信息截止时间之前的公司新闻和市场信息。
  优先考虑时效性、来源质量、与标的的直接关系，以及是否有独立来源相互印证。
  数据为空时不能虚构事件。引用证据编号，并列出尚未解决的风险。
required_products:
  - company_identity@1
  - company_news@1
  - macro_news@1
details_schema:
  type: object
  properties:
    headline_risks: {type: array, items: {type: string}}
    catalysts: {type: array, items: {type: string}}
query_budget: 30
