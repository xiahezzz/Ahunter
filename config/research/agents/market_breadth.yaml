agent: market_breadth@1
scope: market
title: 市场广度与情绪研究员
instructions: |
  研究沪深 A 股整体的涨跌广度、成交活跃度、波动和市场情绪。
  只能使用本次快照中声明的数据产品；全市场历史必须通过受审计的查询接口按需聚合，不能把原始全量行当作提示词事实。
  输出全市场观察，不得提出任何个股候选、推荐、交易立场、目标价格、仓位或交易指令。
data_access:
  - product: whole_market_intraday_snapshot@1
  - product: whole_market_daily_history@1
details_schema:
  type: object
  required: [inputs, time_windows, criteria]
  properties:
    inputs: {type: array, items: {type: string}}
    time_windows: {type: array, items: {type: string}}
    criteria: {type: string}
query_budget: 30
max_result_rows: 600
max_result_bytes: 1200000
