[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-hunter-advisor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "matplotlib>=3.9,<4",
  "mplfinance>=0.12.10b0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "httpx>=0.27,<1"]

[project.scripts]
ahunter = "advisor.cli.main:main"
advisor-market-daily = "advisor.market_daily.cli:main"
advisor-services = "advisor.services.cli:main"
advisor-ledger-import = "advisor.ledger.importer:main"
advisor-research = "advisor.research.cli:main"
advisor-scheduled-premarket = "advisor.scheduler.premarket:main"
advisor-scheduled-review = "advisor.scheduler.review:main"
advisor-launchd-render = "advisor.scheduler.launchd:main"
advisor-launchd-manage = "advisor.scheduler.launchd:manage_main"
advisor-runtime-bootstrap = "advisor.runtime_env:main"

[tool.setuptools.packages.find]
include = ["advisor*"]

[tool.pytest.ini_options]
testpaths = ["tests/advisor"]
pythonpath = ["."]
